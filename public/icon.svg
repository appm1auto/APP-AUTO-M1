<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a" />
      <stop offset="50%" stop-color="#1d4ed8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="metal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="50%" stop-color="#e2e8f0" />
      <stop offset="100%" stop-color="#94a3b8" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.35" />
    </filter>
  </defs>
  <!-- Background Rounded Rect -->
  <rect width="512" height="512" rx="112" fill="url(#bg)" />
  
  <!-- Outer Stylized Gear / Shield Ring -->
  <g filter="url(#shadow)" transform="translate(256, 256)">
    <!-- Outer Octagon Gear notches -->
    <path d="M -160,-66 L -160,66 L -66,160 L 66,160 L 160,66 L 160,-66 L 66,-160 L -66,-160 Z"
          fill="none" stroke="rgba(255,255,255,0.18)" stroke-width="14" stroke-linejoin="round" />
          
    <!-- Main Automotive 'C' Wheel / Rotor Silhouette -->
    <path d="M 90,-120 A 150 150 0 1 0 90,120 L 45,75 A 90 90 0 1 1 45,-75 Z"
          fill="url(#metal)" />
          
    <!-- Dynamic Speed Wing / Piston Center Pin -->
    <circle cx="0" cy="0" r="42" fill="#0f172a" />
    <circle cx="0" cy="0" r="24" fill="#38bdf8" />
    <circle cx="0" cy="0" r="10" fill="#ffffff" />
    
    <!-- 4 Piston / Rotor Accents -->
    <circle cx="-65" cy="-65" r="9" fill="#0f172a" opacity="0.6" />
    <circle cx="-92" cy="0" r="9" fill="#0f172a" opacity="0.6" />
    <circle cx="-65" cy="65" r="9" fill="#0f172a" opacity="0.6" />
    
    <!-- Express Arrow in Gap of C -->
    <path d="M 60,-40 L 130,0 L 60,40 L 75,0 Z" fill="#38bdf8" />
  </g>
</svg>
